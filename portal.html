<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheger Bread &amp; Flour Factory</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/portal.css" />
</head>

<body class="portal-body">

  <main class="portal-shell">
    <!-- Center Brand Logo & Title -->
    <div class="portal-brand-center">
      <img src="assets/logo.png" alt="Sheger Logo" class="portal-logo" />
      <h1 class="portal-title">Sheger Bread &amp; Flour Factory</h1>
      <p class="portal-subtitle">Quick Links &amp; Documents</p>
    </div>

    <!-- Clean Buttons Stack -->
    <nav class="portal-buttons" aria-label="Quick Links">
      <button type="button" class="portal-btn" data-img="assets/1.jpeg" data-title="Product Catalog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        Product Catalog
      </button>

      <button type="button" class="portal-btn" data-img="assets/IMG_0912.JPG" data-title="Company Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        Company Profile
      </button>

      <button type="button" class="portal-btn" data-img="assets/broshour.png" data-title="Brochure">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        Brochure
      </button>

      <button type="button" class="portal-btn" data-img="assets/IMG_0916.JPG" data-title="Contact Us">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        Contact Us
      </button>

      <button type="button" class="portal-btn portal-btn-gold" id="btn-feedback">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Give Us Feedback
      </button>
    </nav>

    <!-- Domain Link -->
    <div class="portal-domain-link-wrap">
      <a href="./index.html" class="portal-domain-link">shegerdaboandflourfactory.com</a>
    </div>
  </main>

  <!-- Clean Image Popup Modal -->
  <div class="simple-modal" id="img-modal" role="dialog" aria-modal="true">
    <div class="modal-bar">
      <span class="modal-title" id="modal-title"></span>
      <button type="button" class="modal-close-btn" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-img-wrap">
      <img src="" alt="" class="modal-img" id="modal-img" />
    </div>
  </div>

  <!-- Clean Feedback Modal -->
  <div class="simple-modal" id="feedback-modal" role="dialog" aria-modal="true">
    <div class="feedback-box">
      <form id="feedback-form">
        <h3>Give Us Feedback</h3>
        <p>Tell us about your experience!</p>

        <div class="feedback-stars">
          <button type="button" data-star="1" class="active">&#9733;</button>
          <button type="button" data-star="2" class="active">&#9733;</button>
          <button type="button" data-star="3" class="active">&#9733;</button>
          <button type="button" data-star="4" class="active">&#9733;</button>
          <button type="button" data-star="5" class="active">&#9733;</button>
        </div>

        <textarea placeholder="Write your feedback here..." required></textarea>

        <button type="submit" class="submit-btn">Send Feedback</button>
      </form>

      <div class="feedback-done" id="feedback-done">
        <h4>Thank You!</h4>
        <p>Your feedback has been received.</p>
        <button type="button" class="submit-btn" id="feedback-done-close">Close</button>
      </div>
    </div>
  </div>

  <script src="js/portal.js"></script>
</body>

</html>
